name: superpowers
version: 1
description: spec-driven, with design via superpowers:brainstorming, tasks via writing-plans, apply via subagent-driven-development
artifacts:
  - id: proposal
    generates: proposal.md
    description: Initial proposal document outlining the change
    template: proposal.md
    instruction: |
      Create the proposal document that establishes WHY this change is needed.

      Sections:
      - **Why**: 1-2 sentences on the problem or opportunity. What problem does this solve? Why now?
      - **What Changes**: Bullet list of changes. Be specific about new capabilities, modifications, or removals. Mark breaking changes with **BREAKING**.
      - **Capabilities**: Identify which specs will be created or modified:
        - **New Capabilities**: List capabilities being introduced. Each becomes a new `specs/<capability-path>/spec.md`. Name each capability for a durable system behavior (for example, `user-auth`), not the work in this change (for example, `add-login-endpoint`). Choose a cohesive boundary that can own related requirements as the system evolves; avoid broad catch-all capabilities. Use kebab-case for path segments you introduce (e.g., `user-auth` or `identity/user-auth`) and follow the project's existing spec organization.
        - **Modified Capabilities**: List existing capabilities whose REQUIREMENTS are changing. Only include if spec-level behavior changes (not just implementation details). Each needs a delta spec file. Use the exact existing path under `openspec/specs/`. Leave empty if no requirement changes.
      - **Impact**: Affected code, APIs, dependencies, or systems.

      IMPORTANT: The Capabilities section is critical. It creates the contract between
      proposal and specs phases. Research existing specs before filling this in:
      1. Run `openspec list --specs` for the project's capability inventory (plain
         `openspec list` shows in-flight changes instead).
      2. For any capability that looks related, run
         `openspec show "<capability-path>" --type spec --json --no-scenarios`: it
         returns the capability's purpose and requirement texts without pulling
         whole spec files into context. Keep `--type spec`: without it, a change
         and a spec sharing a name is an ambiguous-item error.
      3. Before deciding what is already covered or what should change, read each
         relevant spec in full, including scenarios, with
         `openspec show "<capability-path>" --type spec`.
      If this workflow selected a store, append its `--store "<id>"` to each of
      these commands. Reuse an existing capability's exact path instead of
      introducing a near-duplicate name. Each capability listed here will need a
      corresponding spec file.

      Every change must either declare at least one capability (new or
      modified) or opt out of specs by adding the line `skip_specs: true` to
      the change folder's `.openspec.yaml`: `openspec validate` rejects a change
      with zero deltas otherwise. Use `skip_specs: true` only when no spec-level
      behavior changes (pure refactor, tooling, docs) - specs describe
      behavior, so if behavior does not change, no spec should change either.
      Do not invent a requirement just to satisfy validation.

      Keep it concise (1-2 pages). Focus on the "why" not the "how" -
      implementation details belong in design.md.

      Write every scope or behavior call the user has not settled into
      proposal.md as an explicit assumption: superpowers:brainstorming
      confirms them with the user in the design step.

      This is the foundation - specs, design, and tasks all build on this.
    requires: []

  - id: specs
    generates: "specs/**/*.md"
    description: Detailed specifications for the change
    template: spec.md
    instruction: |
      Create specification files that define WHAT the system should do.

      A spec is a behavior contract, not an implementation plan.

      Good spec content:
      - Observable behavior users or downstream systems rely on
      - Inputs, outputs, and error conditions
      - External constraints (security, privacy, reliability, compatibility)
      - Scenarios that can be tested or explicitly validated

      Avoid in specs:
      - Internal class/function names
      - Library or framework choices
      - Step-by-step implementation details
      - Detailed execution plans (those belong in design.md or tasks.md)

      Quick test: if the implementation can change without changing externally
      visible behavior, it likely does not belong in the spec.

      Create one spec file per capability listed in the proposal's Capabilities section.
      `<capability-path>` is the spec directory relative to `specs/` (for example,
      `user-auth` or `identity/user-auth`). Preserve the full path:
      - New capabilities: use the exact path from the proposal at `specs/<capability-path>/spec.md`. Any path segment newly introduced in the proposal must be kebab-case. Follow the project's existing organization: in a flat layout, keep the path to one segment.
      - Modified capabilities: write the delta at `specs/<capability-path>/spec.md`, with `<capability-path>` exactly as `openspec list --specs` prints it (append the selected store's `--store "<id>"` if this workflow selected one). Run that command before writing the delta: a mistyped or invented path targets a capability that does not exist rather than the one you meant. Keep the capability at its existing path.

      Write the spec files one at a time, so the user sees progress and an
      interrupted run keeps the files it already wrote:
      - Before writing anything, compare the capabilities the proposal lists
        with the `specs/<capability-path>/spec.md` files that already exist,
        and start with the first capability that has no file. Keep existing
        files as they are; rewrite one only when the user asks.
      - Before each file, say in one line which capability you are writing.
      - Write each file as soon as you have drafted it.
      - Stop when every capability the proposal lists has its file.

      There must be at least one spec file unless the change's `.openspec.yaml`
      sets `skip_specs: true` (no spec-level behavior change) - `openspec validate`
      rejects a zero-delta change without that marker. If the proposal lists no
      capabilities and `skip_specs` is not set, revisit the proposal first.

      Delta operations (use ## headers):
      - **ADDED Requirements**: New capabilities
      - **MODIFIED Requirements**: Changed behavior - MUST include full updated content
      - **REMOVED Requirements**: Deprecated features - MUST include **Reason** and **Migration**
      - **RENAMED Requirements**: Name changes only - use FROM:/TO: format

      Format requirements:
      - Each requirement: `### Requirement: <requirement name>` followed by description
      - Use SHALL/MUST for normative requirements (avoid should/may)
      - Each scenario: `#### Scenario: <scenario name>` with WHEN/THEN format
      - **CRITICAL**: Scenarios MUST use exactly 4 hashtags (`####`). `openspec validate` rejects a requirement whose scenarios use 3 hashtags or bullets.
      - Every requirement MUST have at least one scenario.
      - Description length: keep each requirement's description (the text between `### Requirement:` and its first scenario) to 500 characters or fewer. `openspec validate` warns on longer descriptions in ADDED requirements and in the main spec; `openspec validate --strict` fails on them.
        - ADDED: state one behavior per requirement. Move examples and edge cases into scenarios, and split a requirement that covers several behaviors into separate `### Requirement:` blocks, each with its own scenarios.
        - MODIFIED: keep the existing requirement block whole, at any length. Split it only when the user asks for it, in a change made for that purpose (see below).

      Splitting an existing long requirement, only when the user asks for it: under
      MODIFIED, keep its header and every scenario and cut its description down to
      one behavior without changing its meaning; then add each behavior you removed
      as its own ADDED requirement with its own scenarios.

      New capabilities only: the delta spec's first section is `## Purpose` -
      one or two sentences (50+ characters, or `openspec validate --strict`
      reports it as too brief) describing what the capability is for. Archive
      copies it into the main spec it creates; without it the new main spec is
      left with a `TBD ... Update Purpose after archive` placeholder to fill in
      by hand. Do NOT add `## Purpose` to a delta for an existing capability -
      that spec already has one and the delta's is ignored. To change an
      existing capability's Purpose - including a leftover `TBD` placeholder -
      edit `<planningHome.root>/openspec/specs/<capability-path>/spec.md`
      directly. `planningHome.root` comes from the `openspec instructions ...
      --json` response. Always use it rather than a repo-relative path: it
      resolves to the store whenever the change lives in one - whether that
      came from `--store`, a project `store:` pointer, or a global default
      store - and to the current repository otherwise. Use the field as given;
      it has already resolved which case applies.

      MODIFIED requirements workflow:
      1. Locate the existing requirement in `<planningHome.root>/openspec/specs/<capability-path>/spec.md` (the same store-aware root as above)
      2. Copy the ENTIRE requirement block (from `### Requirement:` through all scenarios)
      3. Paste under `## MODIFIED Requirements` and edit to reflect new behavior
      4. Ensure header text matches exactly (whitespace-insensitive)

      Common pitfall: Using MODIFIED with partial content loses detail at archive time.
      If adding new concerns without changing existing behavior, use ADDED instead.

      Example (a new capability, so its first section is `## Purpose`):
      ```
      # Spec Delta

      ## Purpose

      Lets users take their data out of the product in a portable format.

      ## ADDED Requirements

      ### Requirement: User can export data
      The system SHALL allow users to export their data in CSV format.

      #### Scenario: Successful export
      - **WHEN** user clicks "Export" button
      - **THEN** system downloads a CSV file with all user data

      ## REMOVED Requirements

      ### Requirement: Legacy export
      **Reason**: Replaced by new export system
      **Migration**: Use new export endpoint at /api/v2/export
      ```

      Specs should be testable - each scenario is a potential test case.
    requires:
      - proposal

  - id: design
    generates: design.md
    description: Technical design document with implementation details
    template: design.md
    instruction: |
      Precheck: if superpowers:brainstorming is not in your available
      skills, tell the user the superpowers plugin is missing and stop.
      Never write the design yourself in its place.

      Always write design.md. Invoke the superpowers:brainstorming skill.
      proposal.md and specs/ are drafts of the what: brainstorming reads them
      first, confirms their assumptions with the user, and designs the how.
      If it changes scope or behavior, update proposal.md and specs/ first.

      Brainstorming first judges whether anything that matters is still open:
      1. If everything that matters is settled in proposal.md and specs/ (no
         open assumptions), or the user takes brainstorming's offer to just
         get going, ask exactly: "Skip the design?"
      2. Only an explicit yes to that question skips the design; a short or
         ambiguous answer to another question is not a yes. Write design.md
         with `Skipped: <reason>` as its first line, then one line per
         how-it-gets-made choice (language, libraries).
      3. Any other answer, or anything still open: run brainstorming to
         approval and save its design doc to
         openspec/changes/<change-name>/design.md, not docs/superpowers/specs/.
         Use the template's headings.

      This step plans only: offer no spikes, since they write project code.
      If brainstorming finds several independent projects, ask the user which
      one this change covers and note the others under What Changes in
      proposal.md as out of scope.

      Leave design.md uncommitted: the tasks step commits the change folder
      after plan approval.

      After design.md is approved or skipped, run
      `openspec instructions tasks --change "<change-name>" --json` next, and
      invoke writing-plans as its instruction says.
    requires:
      - proposal
      - specs

  - id: tasks
    generates: tasks.md
    description: Implementation checklist with trackable tasks
    template: tasks.md
    instruction: |
      Precheck: if superpowers:writing-plans is not in your available
      skills, tell the user the superpowers plugin is missing and stop.
      Never write the plan yourself in its place.

      Invoke the superpowers:writing-plans skill and save its plan to
      openspec/changes/<change-name>/tasks.md, not docs/superpowers/plans/.
      On top of its format:
      - Task format: OpenSpec counts every `- [ ]` line, even inside code
        blocks, while apply works in whole tasks. Put exactly one checkbox
        directly under each task heading, and write steps as bold lines
        without checkboxes:
        ```
        ### Task 1: <task name>
        - [ ] Task 1: <task name>
        **Step 1: Write the failing test**
        ```
      - Header: replace the line starting `> **For agentic workers:**` with
        this line:
        ```
        > **For agentic workers:** Execute with /opsx:apply, which runs superpowers:subagent-driven-development task-by-task. Each task has one checkbox (`- [ ]`) for tracking.
        ```
        Under it, add `**Base branch:** <base branch>`, using the base branch
        recorded before the worktree was created (ask the user if it is not
        known): the final review's merge-base and finishing's merge target
        use it.
      - Set the header's `**Spec:**` field to
        `openspec/changes/<change-name>/`, and name every `#### Scenario:`
        from specs/ in at least one test step.
      - Refer to untracked or git-ignored files (not in the worktree) by
        their absolute path in the main checkout, the first path
        `git worktree list` prints.
      - Before planning, resolve with the user every choice in design.md that
        is still open and would change what gets built. If design.md starts
        with `Skipped:`, plan from proposal.md and specs/.
      - If self-review finds an error in proposal.md, specs/ or design.md,
        fix it there and list each behavior or scope edit when asking for
        plan approval. Typo and format fixes need no mention.

      When the user approves the plan: commit the change folder, tell them
      to run /opsx:apply, and stop. Skip the execution-method question and
      never offer to apply the change yourself.
    requires:
      - specs
      - design

apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    Precheck: if superpowers:subagent-driven-development or
    superpowers:finishing-a-development-branch is not in your available
    skills, tell the user the superpowers plugin is missing and stop before
    any code changes. Never execute the plan inline in its place.

    Replace step 6 of the apply workflow (its task loop and per-checkbox
    ticking): invoke the superpowers:subagent-driven-development skill with
    tasks.md as the plan. That skill's stop rules replace the apply
    workflow's pause rules: make rulings where it says to, and stop only
    where it or this instruction says so. On top of that skill:
    - Every implementer dispatch includes the plan's plan-wide rules (its
      Global Constraints section): the per-task extract the skill hands an
      implementer holds only that task's section. Write the plan-wide rules
      once to `global-constraints.md` beside the skill's other files for
      this plan and point each dispatch at it.
    - When the skill records `Task N` as complete, tick that task's
      `- [ ] Task N:` line in tasks.md (find it via the apply instructions'
      sourcePath and line) and commit the tick.
    - After the final whole-branch review, before archive, stop and report
      to the user if any of these holds; they decide how to continue:
      - The review left a Critical or Important finding open (ruled on, not
        fixed). Show those findings with every ruling the skill made during
        the run; never carry them into a merge.
      - `openspec instructions apply --change "<name>" --json` does not
        report `state: all_done` (archive's `-y` skips its own
        incomplete-task check). List the open tasks.
      - The project's full test suite fails.
    - Otherwise: finish the skill's own close-out (report its rulings, clean
      up its files for this plan), then run `openspec archive "<name>" -y`
      (it merges the delta specs into openspec/specs/ itself), commit, and
      invoke superpowers:finishing-a-development-branch.
